    <text x="16" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">2</text>
    <rect x="40" y="72" width="110" height="9" rx="4.5" fill="#e6edf3" fill-opacity="0.75"/>
    <rect x="158" y="72" width="50" height="9" rx="4.5" fill="#f97316" fill-opacity="0.75"/>
    <text x="16" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">3</text>
    <rect x="58" y="90" width="70" height="9" rx="4.5" fill="#60a5fa" fill-opacity="0.75"/>
    <rect x="136" y="90" width="120" height="9" rx="4.5" fill="#4ade80" fill-opacity="0.75"/>
    <text x="16" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">4</text>
    <rect x="58" y="108" width="90" height="9" rx="4.5" fill="#e6edf3" fill-opacity="0.75"/>
    <rect x="156" y="108" width="60" height="9" rx="4.5" fill="#f97316" fill-opacity="0.75"/>
    <text x="16" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">5</text>
    <rect x="76" y="126" width="80" height="9" rx="4.5" fill="#4ade80" fill-opacity="0.75"/>
    <rect x="164" y="126" width="70" height="9" rx="4.5" fill="#c9d1d9" fill-opacity="0.75"/>
    <text x="16" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">6</text>
    <rect x="58" y="144" width="50" height="9" rx="4.5" fill="#c084fc" fill-opacity="0.75"/>
    <rect x="116" y="144" width="100" height="9" rx="4.5" fill="#e6edf3" fill-opacity="0.75"/>
    <text x="16" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">7</text>
    <rect x="40" y="162" width="30" height="9" rx="4.5" fill="#8b949e" fill-opacity="0.75"/>
    <rect x="78" y="160" width="7" height="12" fill="#e6edf3" fill-opacity="0.8"/>
  </g>

  <!-- Texte -->
  <text x="80" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#f97316">// hello world</text>
  <text x="76" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#e6edf3" letter-spacing="1">Mathys CHENU</text>
  <rect x="80" y="180" width="140" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9d1d9">Étudiant en BUT Informatique</text>
  <text x="80" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b949e">Aix-en-Provence</text>
